# Render deployment (https://render.com). See docs/DEPLOY.md.
services:
  - type: web
    name: kinora
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server.main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips="*"
    healthCheckPath: /healthz
    envVars:
      # Leave empty for demo mode. Add it later in Render → kinora → Environment.
      - key: OPENAI_API_KEY
        sync: false
      # Optional. Testers must enter this code before chatting. Leave empty for an open link.
      - key: KINORA_ACCESS_CODE
        sync: false
      - key: KINORA_ADMIN_TOKEN
        generateValue: true
